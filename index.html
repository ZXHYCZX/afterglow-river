<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#091a24">
  <meta name="description" content="一场关于爱、告别与继续生活的夜航。划过夜河，拾起六段回忆，把余光留给明天。">
  <title>把余光留给你 · After the Last Light</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23091a24'/%3E%3Cpath d='M32 12v8M23 21h18l-2 24H25zM20 50h24' fill='none' stroke='%23edc992' stroke-width='3'/%3E%3Cpath d='M32 28q-8 11 0 12q8-1 0-12' fill='%23edc992'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main id="world" class="world">
    <div class="landscape" aria-hidden="true"></div>
    <div class="atmosphere" aria-hidden="true"></div>
    <canvas id="river" aria-label="夜河航行区域。使用方向键或 WASD 划船，靠近金色记忆，空格守灯。也可按住水面拖动。"></canvas>
    <header class="topbar">
      <a class="wordmark" href="./" aria-label="把余光留给你，回到开始"><span class="mark">◈</span> 余光 <span class="edition">A SHORT JOURNEY</span></a>
      <div class="top-actions">
        <button id="journal-btn" class="icon-button" hidden>回忆 <span id="memory-count">0 / 6</span></button>
        <button id="sound-btn" class="icon-button" aria-pressed="false" aria-label="开启声音"><span aria-hidden="true">♫</span> <span id="sound-label">声音关</span></button>
        <button id="pause-btn" class="icon-button" hidden aria-label="暂停游戏">Ⅱ</button>
      </div>
    </header>
    <section id="title-screen" class="title-screen">
      <div class="eyebrow"><span></span> AFTER THE LAST LIGHT</div>
      <h1>把余光<br>留给你<span class="title-dot">。</span></h1>
      <p class="title-copy">有些人，不能陪你到对岸。<br>有些光，可以。</p>
      <button id="start-btn" class="primary">点灯，启程 <span aria-hidden="true">✦</span></button>
      <p class="duration">约 5–8 分钟 · 建议开启声音</p>
      <div class="saved-note" id="saved-note" hidden></div>
    </section>
    <div id="title-note" class="title-note"><span>写给每一个</span><span>仍在想念的人</span></div>
    <footer id="title-footer" class="title-footer"><span>一场关于爱、告别与继续生活的夜航</span><span>耳机 / 键盘 / 触屏</span></footer>
    <section id="hud" class="hud" hidden aria-label="航行状态">
      <div class="chapter"><span id="chapter-number">第一章</span><h2 id="chapter-title">初见的河岸</h2></div>
      <div class="journey-track" aria-label="旅程进度"><div id="journey-fill"></div><i></i><i></i><i></i></div>
      <div class="light-stat"><span>灯火</span><div class="light-meter" role="meter" aria-label="灯火余量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div id="light-fill"></div></div><span id="light-value">100</span></div>
    </section>
    <div id="caption" class="caption" role="status" aria-live="polite"></div>
    <div id="controls" class="controls" hidden><span class="desktop-instruction"><kbd>W A S D</kbd> / 方向键划船 <b>·</b> 按住 <kbd>空格</kbd> 守灯</span><span class="touch-instruction">按住水面拖动划船</span><span class="common-instruction">靠近金色记忆 · 灯点可以补充灯火</span><button id="shield-btn" class="shield-button" aria-label="按住守灯">守灯</button></div>
    <div id="overlay" class="overlay" hidden>
      <section id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1"></section>
    </div>
    <div id="ending-screen" class="ending-screen" hidden></div>
  </main>
</body>
</html>
